name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      debug_env:
        description: "Debug: in cấu trúc .env sinh từ secret (chỉ bật khi cần)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  # File này do CI tự sinh từ secrets, KHÔNG commit (đã có trong .gitignore).
  ENV_FILE_PATH: .env.production.local

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      # Kiểm tra cấu hình trước, để không tốn thời gian npm ci + build rồi mới fail.
      - name: Validate configuration
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          missing=0
          if [ -z "${CF_API_TOKEN}" ]; then
            echo "::error::Thiếu secret CLOUDFLARE_API_TOKEN — thêm ở Settings → Secrets and variables → Actions → tab Secrets."
            missing=1
          fi
          if [ -z "${CF_ACCOUNT_ID}" ]; then
            echo "::error::Thiếu secret CLOUDFLARE_ACCOUNT_ID — thêm ở tab Secrets."
            missing=1
          fi
          if [ -z "${CF_PAGES_PROJECT}" ]; then
            echo "::error::Thiếu variable CLOUDFLARE_PAGES_PROJECT — phải nằm ở tab Variables (không phải tab Secrets)."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Dừng sớm: cấu hình chưa đủ. Nếu bạn dùng GitHub Environment, secrets phải nằm trong environment 'production' hoặc ở cấp repository."
            exit 1
          fi
          echo "Cấu hình OK."

      - name: Checkout
        uses: actions/checkout@v7

      # Cloudflare KHÔNG tự tạo Pages project khi deploy → phải có project trước.
      # Idempotent: đã có thì bỏ qua, chưa có thì tạo, tạo lỗi thì in chẩn đoán.
      # Đặt trước bước build để phát hiện sai account/tên trong vài giây.
      - name: Ensure Pages project exists
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          # Phải khớp branch kích hoạt workflow và --branch ở step deploy.
          PRODUCTION_BRANCH: main
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}"
          auth="Authorization: Bearer ${CF_API_TOKEN}"

          get() { curl -sS -H "$auth" "$1"; }
          ok() { printf '%s' "$1" | grep -Eq '"success"[[:space:]]*:[[:space:]]*true'; }

          existing="$(get "${base}/pages/projects/${CF_PAGES_PROJECT}")"
          if ok "$existing"; then
            echo "Pages project '${CF_PAGES_PROJECT}' đã tồn tại."
            exit 0
          fi

          echo "Không thấy project '${CF_PAGES_PROJECT}' trong account của token → tạo mới (production branch: ${PRODUCTION_BRANCH})."
          created="$(curl -sS -H "$auth" -H 'Content-Type: application/json' \
            --data "{\"name\":\"${CF_PAGES_PROJECT}\",\"production_branch\":\"${PRODUCTION_BRANCH}\"}" \
            "${base}/pages/projects")"

          if ok "$created"; then
            echo "Đã tạo Pages project '${CF_PAGES_PROJECT}'."
            exit 0
          fi

          echo "::error::Không tạo được Pages project '${CF_PAGES_PROJECT}'."
          printf '%s\n' "$created"

          echo ""
          echo "── CHẨN ĐOÁN ────────────────────────────────────────────"
          echo "Pages project đang có trong account mà token thuộc về:"
          projects="$(get "${base}/pages/projects?per_page=100" || true)"
          if command -v jq >/dev/null 2>&1; then
            printf '%s' "$projects" | jq -r '.result[]? | "  - \(.name)"' || true
          else
            printf '%s' "$projects" | grep -o '"name":"[^"]*"' || true
          fi

          echo "Worker đang có (trường hợp bạn tạo Worker thay vì Pages project):"
          workers="$(get "${base}/workers/scripts" || true)"
          if command -v jq >/dev/null 2>&1; then
            printf '%s' "$workers" | jq -r '.result[]? | "  - \(.id)"' || true
          else
            printf '%s' "$workers" | grep -o '"id":"[^"]*"' || true
          fi
          echo "Nếu tên project nằm trong danh sách Worker phía trên, nghĩa là bạn đã tạo Worker — hãy tạo Pages project cùng tên, hoặc chuyển workflow sang 'wrangler deploy'."
          exit 1

      # Node >= 22 là bắt buộc: Wrangler v4 (dùng bởi wrangler-action@v4) yêu cầu Node >= 22.
      # Dùng 24 (Active LTS) — cũng là bản đã build thử thành công ở local.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Toàn bộ env nằm trong 1 secret duy nhất: ENV_FILE ──────────────────
      # Dán nguyên nội dung file .env (nhiều dòng) vào secret ENV_FILE.
      # Secret lẻ (VITE_API_BASE, VITE_CLERK_PUBLISHABLE_KEY) là tuỳ chọn,
      # nếu có giá trị thì ghi sau → ghi đè giá trị cùng tên trong ENV_FILE.
      - name: Write env file from secrets
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          : > "$ENV_FILE_PATH"

          if [ -n "${ENV_FILE:-}" ]; then
            # tr -d '\r' để an toàn khi dán nội dung kiểu Windows (CRLF).
            printf '%s\n' "$ENV_FILE" | tr -d '\r' >> "$ENV_FILE_PATH"
          fi

          for name in VITE_API_BASE VITE_CLERK_PUBLISHABLE_KEY; do
            value="$(printenv "$name" || true)"
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$name" "$(printf '%s' "$value" | tr -d '\r')" >> "$ENV_FILE_PATH"
            fi
          done

          if [ -s "$ENV_FILE_PATH" ]; then
            echo "Đã tạo $ENV_FILE_PATH với các biến (chỉ in tên, không in giá trị):"
            grep -oE '^[A-Za-z_][A-Za-z0-9_]*' "$ENV_FILE_PATH" | sort -u || true
          else
            echo "::warning::Không có secret env nào — app sẽ build với API_BASE rỗng (gọi /api cùng domain)."
          fi

      # ── Debug .env sinh từ secret ───────────────────────────────────────────
      # Chỉ chạy khi vào Actions → Run workflow và tick ô debug_env.
      # Không in giá trị của biến không phải VITE_ (những biến đó có thể là secret thật).
      # Biến VITE_* vốn đã công khai trong bundle JS nên in được, và in dạng tách
      # ký tự để không bị cơ chế mask của GitHub thay bằng ***.
      - name: Debug env file
        if: ${{ github.event.inputs.debug_env == 'true' }}
        run: |
          if [ ! -f "$ENV_FILE_PATH" ]; then
            echo "Không có file $ENV_FILE_PATH."
            exit 0
          fi

          dq='"'
          sq="'"
          echo "::warning::Đang chạy ở chế độ debug env — nội dung dưới đây chỉ để chẩn đoán."
          echo "== $ENV_FILE_PATH =="
          echo "số dòng: $(wc -l < "$ENV_FILE_PATH") | số byte: $(wc -c < "$ENV_FILE_PATH")"
          echo ""

          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              '') echo "(dòng trống)"; continue ;;
              '#'*) echo "(comment — không in nội dung)"; continue ;;
            esac

            name="${line%%=*}"
            name="${name#export }"
            value="${line#*=}"
            value="${value%$dq}"; value="${value#$dq}"
            value="${value%$sq}"; value="${value#$sq}"
            value="$(printf '%s' "$value" | sed -e 's/[[:space:]]*$//')"

            echo "BIẾN: [$name]"
            echo "  độ dài giá trị : ${#value} ký tự"
            echo "  sha256 (16 đầu): $(printf '%s' "$value" | sha256sum | cut -c1-16)"
            case "$value" in
              "") echo "  ⚠ giá trị RỖNG — Vite sẽ coi như không có biến này" ;;
              *"'"*|*'"'*) echo "  ⚠ giá trị còn chứa dấu nháy" ;;
            esac
            case "$value" in
              *$'\r'*) echo "  ⚠ giá trị còn ký tự CR (\\r)" ;;
            esac
            case "$name" in
              VITE_*)
                echo "  giá trị (đã tách ký tự để vượt mask): $(printf '%s' "$value" | sed 's/./& /g')"
                ;;
              *)
                echo "  giá trị: KHÔNG in — chỉ biến có tiền tố VITE_ mới được nhúng vào bundle."
                ;;
            esac
            echo ""
          done < "$ENV_FILE_PATH"

          if ! grep -qE '^[[:space:]]*(export[[:space:]]+)?VITE_API_BASE=' "$ENV_FILE_PATH"; then
            echo "::warning::Không thấy dòng VITE_API_BASE trong $ENV_FILE_PATH — app sẽ gọi /api vào chính domain Pages."
          fi

      - name: Build application
        run: npm run build

      # Vite chỉ nhúng vào bundle những biến mà app thực sự đọc qua import.meta.env.
      # Biến như VITE_API_TARGET (chỉ dùng cho dev proxy trong vite.config.ts) không
      # bao giờ vào bundle → không được coi là lỗi.
      # Step này xác nhận giá trị thật sự đã nằm trong dist/ — nếu không, app sẽ
      # gọi /api vào chính domain Pages (404) mà không báo lỗi gì.
      - name: Verify env baked into bundle
        run: |
          set -euo pipefail
          if [ -s "$ENV_FILE_PATH" ]; then
            env_file="$ENV_FILE_PATH"
          else
            env_file="/dev/null"
            echo "::warning::$ENV_FILE_PATH trống — không có biến env nào lúc build."
          fi

          # Danh sách biến app thật sự đọc qua import.meta.env (lấy từ mã nguồn).
          # Biến không nằm trong danh sách này — ví dụ VITE_API_TARGET chỉ dùng cho
          # dev proxy trong vite.config.ts — không bao giờ vào bundle, không phải lỗi.
          used="$(grep -rhoE 'import\.meta\.env\.[A-Za-z_][A-Za-z0-9_]*' src 2>/dev/null \
            | sed 's/.*\.//' | sort -u \
            | grep -vE '^(MODE|BASE_URL|DEV|PROD|SSR)$' || true)"
          used_flat=" $(printf '%s' "$used" | tr '\n' ' ') "
          echo "Biến bundle đọc lúc build:${used_flat}"

          dq='"'
          sq="'"
          missing=0
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in ''|'#'*) continue ;; esac
            name="${line%%=*}"
            name="${name#export }"
            value="${line#*=}"
            # bỏ nháy bao quanh giá trị (dotenv cho phép "..." hoặc '...')
            value="${value%$dq}"; value="${value#$dq}"
            value="${value%$sq}"; value="${value#$sq}"
            value="$(printf '%s' "$value" | sed -e 's/[[:space:]]*$//')"
            [ -n "$value" ] || continue

            in_use=0
            case "$used_flat" in *" $name "*) in_use=1 ;; esac
            if [ "$in_use" -eq 0 ]; then
              echo "BỎ QUA $name → app không đọc biến này trong bundle (ví dụ: chỉ dùng cho dev proxy)."
              continue
            fi

            if grep -RqF -- "$value" dist; then
              echo "OK   $name → đã nhúng vào bundle."
            else
              echo "::error::$name có giá trị nhưng KHÔNG thấy trong dist/ — app đọc biến này nên bundle sẽ chạy sai. Kiểm tra lại tên biến và giá trị."
              missing=1
            fi
          done < "$env_file"

          # Chiều ngược lại: app đọc biến mà lúc build không có giá trị.
          for n in $used; do
            if ! grep -qE "^[[:space:]]*(export[[:space:]]+)?${n}[[:space:]]*=[[:space:]]*[^[:space:]]" "$ENV_FILE_PATH" 2>/dev/null; then
              echo "::warning::App đọc $n lúc build nhưng $ENV_FILE_PATH không có giá trị → bundle dùng mặc định. Với VITE_API_BASE: app sẽ gọi /api vào chính domain Pages (chỉ đúng nếu có Pages Function proxy)."
            fi
          done

          [ "$missing" -eq 0 ] || exit 1
          echo "Kiểm tra env xong."

      # Xoá env khỏi workspace ngay sau build (chạy cả khi build lỗi).
      - name: Remove env file
        if: always()
        run: rm -f "$ENV_FILE_PATH"

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          # Ghim major để Wrangler không tự nhảy sang bản mới đòi Node cao hơn.
          wranglerVersion: "4"
